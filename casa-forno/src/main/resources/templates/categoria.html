  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

  <nav th:replace="~{fragments/navbar :: navegación}"></nav>

  <section class="section">
    <div class="container">
      <div class="row g-4" id="categoriaGrid">
      </div>

      <div class="text-center mt-5">

    </div>

  <!--FOOTER-->
  <footer th:replace="~{fragments/footer :: piedepagina}"></footer>

  <a href="https://wa.me/51987654321" target="_blank" rel="noopener noreferrer"

    <i class="bi bi-whatsapp"></i>

  <!--  BARRA LATERAL: info del local + acceso de clientes  -->
 <div th:replace="~{fragments/barralateral :: barra-Lateral}"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/data.js}"></script>
